# Repository configuration for the gentoo-ppixiu overlay.
# See portage(5) and GLEP 82 for the repository format.

# This overlay uses the Gentoo repository for eclasses, profiles, and packages.
masters = gentoo

# Git repositories use thin Manifests. BLAKE2B is required for new entries,
# matching the current Gentoo repository policy.
manifest-hashes = BLAKE2B SHA512
manifest-required-hashes = BLAKE2B
thin-manifests = true

# Manifest signing is opt-in for this personal repository.
sign-manifests = false
